name: Update rooster
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 filter_rooster.py
      - run: |
          git config user.name 'Rooster bot'
          git config user.email 'actions@github.com'
          git add rooster-groep-16.ics
          git diff --cached --quiet || git commit -m 'Update rooster'
          git push
